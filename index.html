<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12050b">
<title>Червона Кімната</title>
<style>
:root{color-scheme:dark;--bg:#12050b;--cd:#230d18;--c2:#33172a;--tx:#fdeaf1;--mu:#b98aa0;--ac:#ff2d75;--a2:#ff7a45;--ln:#4d2038;--gd:#ffc857;--pk:#ff4fa3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 480px at 80% -10%,#4a0d2b,transparent),radial-gradient(600px 400px at 0 100%,#2a0a3a,transparent);background-color:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.blur #app{filter:blur(24px)}
#app{max-width:560px;margin:0 auto;padding:14px 14px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--ac),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;margin:18px 0 8px}
.coin{background:#3b1d00;border:1px solid var(--gd);color:var(--gd);border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px}
.ib{background:var(--cd);border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:7px 11px;font-size:17px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));background:#12050bf2;border-top:1px solid var(--ln);z-index:10}
nav button{flex:1;max-width:96px;background:var(--cd);border:1px solid var(--ln);color:var(--mu);border-radius:14px;padding:7px 2px;font:inherit;font-size:11px;cursor:pointer}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--a2));border-color:transparent}
nav span{display:block;font-size:18px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.card.a18{border-color:#ff4fa388;box-shadow:0 0 22px #ff4fa333}
.card h3{margin:6px 0 10px;font-size:19px}
.f{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--ln);font-size:15px}
.f b{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.price{color:var(--gd);font-weight:700}.nu{color:#ffb3cf}
.card img,.card video,.md img,.md video{width:100%;border-radius:14px;margin:6px 0;max-height:340px;object-fit:cover;background:#000}
.bl{filter:blur(28px) brightness(.7)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--c2);color:var(--mu);margin-right:5px}
.t18{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff;background:var(--pk);margin-right:5px;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px #ff4fa3,0 0 12px #ff4fa366}50%{box-shadow:0 0 12px #ff4fa3,0 0 26px #ff4fa3aa}}
.bar{height:9px;border-radius:9px;background:var(--c2);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gd))}
.btn{background:linear-gradient(90deg,var(--ac),var(--a2));color:#fff;border:0;border-radius:14px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--c2);border:1px solid var(--ln)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:12px;color:var(--mu);margin-top:12px;text-transform:uppercase;letter-spacing:.04em}
input,textarea,select{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:12px;color:var(--tx);padding:11px;font:inherit;margin-top:5px}
input[type=checkbox]{width:auto;margin-right:6px}
.mu{color:var(--mu);font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{text-align:center;background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px 8px}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;background:var(--c2) center/cover;border:2px solid var(--ac);box-shadow:0 0 18px #ff2d7566;display:grid;place-items:center;font-size:32px}
.ttl{color:var(--pk);font-weight:700;min-height:22px}
.fi{padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.gal{columns:2;column-gap:10px}
.tile{break-inside:avoid;margin-bottom:10px;border-radius:18px;overflow:hidden;position:relative;background:var(--cd);border:1px solid var(--ln);cursor:pointer}
.tile.a18{border-color:#ff4fa3aa;box-shadow:0 0 16px #ff4fa344}
.tile img{width:100%;display:block;min-height:110px;object-fit:cover}
.tile .ph{height:130px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#3b1030,#1d0a2a)}
.tile .cap{padding:8px 10px;font-size:14px}.tile .t18{position:absolute;top:8px;left:8px}
#md{position:fixed;inset:0;background:#000b;z-index:40;display:none}#md.on{display:block}
.md{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;border:1px solid var(--ln);padding:16px 14px calc(22px + env(safe-area-inset-bottom,0));max-width:560px;margin:0 auto}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--ac),var(--a2));padding:11px 16px;border-radius:16px;z-index:70;display:none;max-width:92%;font-weight:600;box-shadow:0 8px 30px #000a}
#ov{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#5a0f34,#12050b 70%);display:none;place-items:center;text-align:center;padding:24px;overflow:hidden}
#ov.on{display:grid;animation:fi .5s}@keyframes fi{from{opacity:0}}
#ov .big{font-size:64px;animation:pop 1.2s infinite}@keyframes pop{50%{transform:scale(1.18)}}
.fl{position:absolute;bottom:-40px;font-size:26px;animation:up 5s linear infinite;opacity:.85}@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
#lock{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:80}#lock.on{display:grid}
#lock input{text-align:center;font-size:28px;letter-spacing:10px;width:200px}
.auth{max-width:400px;margin:9vh auto 0;padding:0 16px}
</style></head><body>
<div id="app"></div><div id="md"><div class="md" id="mdb"></div></div><div id="toast"></div>
<div id="ov"><div><div class="big" id="ob">🔥</div><h2 id="ot"></h2><div id="ol" class="mu"></div><p class="mu" style="margin-top:22px">Торкнись, щоб продовжити</p></div></div>
<div id="lock"><div><div style="font-size:48px">🔒</div><p class="mu" id="lt">PIN</p><input id="pin" type="password" inputmode="numeric" maxlength="6"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KIND={shop:"🛍 Магазин",wish:"💭 Мрія",quest:"⚡ Квест",drop:"🔒 Новий матеріал"};
const HINT={shop:"Пропозиції для нього: що вона зробить (монети 🔥)",wish:"Галерея мрій: ціна в гривнях ₴",quest:"Завдання для нього: нагорода в монетах 🔥",drop:"Матеріали, які він відкриває сам"};
let CFG=JSON.parse(localStorage.getItem("cfg")||"null"),D={users:[],items:[],events:[]},SHA=null,ME=localStorage.getItem("me"),tab="home",edit=null,lastEv=0;
const meU=()=>D.users.find(u=>u.id===ME),isA=()=>meU()?.role==="admin",him=()=>D.users.find(u=>u.role!=="admin"),her=()=>D.users.find(u=>u.role==="admin");
const cur=k=>k==="wish"?"₴":"🔥";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";navigator.vibrate?.([80,40,80]);clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4500)}

/* ===== GitHub як база даних ===== */
const H=()=>({Authorization:"Bearer "+CFG.token,Accept:"application/vnd.github+json"});
const API=()=>`https://api.github.com/repos/${CFG.repo}/contents/`;
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const enc=s=>{let t="";new TextEncoder().encode(s).forEach(x=>t+=String.fromCharCode(x));return btoa(t)};
async function load(){const r=await fetch(API()+"data/db.json?t="+Date.now(),{headers:H(),cache:"no-store"});
 if(r.status===404){const c=await fetch("https://api.github.com/repos/"+CFG.repo,{headers:H(),cache:"no-store"});
  if(!c.ok)throw Error("Репозиторій не знайдено або токен не має до нього доступу. Перевір назву й права токена.");
  D={users:[],items:[],events:[]};SHA=null;return}
 if(!r.ok)throw Error("GitHub: помилка "+r.status+(r.status===401?" (перевір токен)":r.status===403?" (немає прав)":""));
 const j=await r.json();D=JSON.parse(dec(j.content));SHA=j.sha}
async function put(path,b64,sha,msg){const r=await fetch(API()+path,{method:"PUT",headers:H(),body:JSON.stringify({message:msg,content:b64,...(sha?{sha}:{})})});
 if(!r.ok){const e=new Error(r.status===401?"Токен недійсний або прострочений":r.status===403||r.status===404?"Токен не має права запису (потрібно Contents: Read and write) або репозиторій не знайдено":r.status===413?"Файл завеликий":"GitHub помилка "+r.status);e.status=r.status;throw e}return r.json()}
async function mutate(fn){for(let n=0;n<4;n++){try{await load();fn(D);const j=await put("data/db.json",enc(JSON.stringify(D)),SHA,"update");SHA=j.content.sha;return}catch(e){if(e.status!==409&&e.status!==422)throw e}}throw Error("Конфлікт, спробуй ще раз")}
const ev=(d,kind,text)=>{d.events.push({id:uid(),actor:ME,kind,text,ts:Date.now()});if(d.events.length>200)d.events.splice(0,d.events.length-200)};
const b64of=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
async function shrink(f){const im=await createImageBitmap(f),s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.82).split(",")[1]}
async function up(f){let b,ext;if(f.type.startsWith("image")){b=await shrink(f);ext="jpg"}else{if(f.size>25*1048576)throw Error("Відео більше 25 МБ");b=await b64of(f);ext=(f.name.split(".").pop()||"mp4").slice(0,4).toLowerCase()}
 const p=`media/${uid()}.${ext}`;await put(p,b,null,"media");return p}
const cache={};
async function blob(p){if(cache[p])return cache[p];const r=await fetch(API()+p,{headers:{...H(),Accept:"application/vnd.github.raw+json"}});if(!r.ok)return"";const b=await r.blob();return cache[p]=URL.createObjectURL(new Blob([b],{type:p.endsWith(".jpg")?"image/jpeg":"video/mp4"}))}
function media(){document.querySelectorAll("[data-m]").forEach(async e=>{const p=e.dataset.m;e.removeAttribute("data-m");e.src=await blob(p)});document.querySelectorAll("[data-bg]").forEach(async e=>{const p=e.dataset.bg;e.removeAttribute("data-bg");e.style.backgroundImage=`url('${await blob(p)}')`})}
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:120000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* ===== Підключення, вхід, реєстрація ===== */
function connectView(m=""){
 $("#app").innerHTML=`<div class="auth"><h1 style="font-size:26px;text-align:center">🔗 Підключення до GitHub</h1><p class="mu">Один раз на кожному телефоні. Дані лежать у вашому приватному репозиторії.</p>
 <div class="card"><label>Репозиторій з даними</label><input id="rp" placeholder="ваш-логін/назва-репо" value="${esc(CFG?.repo||"")}"><label>Токен доступу (fine-grained)</label><input id="tk" type="password" placeholder="github_pat_…">
 <div class="row"><button class="btn" id="cn">Підключити</button></div><p class="mu" id="er">${esc(m)}</p></div></div>`;
 $("#cn").onclick=async()=>{CFG={repo:$("#rp").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,""),token:$("#tk").value.trim()};$("#er").textContent="Перевіряю…";try{await load();localStorage.setItem("cfg",JSON.stringify(CFG));start()}catch(e){$("#er").textContent=e.message}}
}
function authView(m=""){
 const full=D.users.length>=2,noA=!her();
 $("#app").innerHTML=`<div class="auth"><h1 style="font-size:28px;text-align:center">🔥 Червона Кімната</h1><p class="mu" style="text-align:center">Лише для двох · <span class="t18">18+</span></p>
 <div class="card"><label>Пошта</label><input id="em" type="email" autocomplete="username"><label>Пароль (від 6 символів)</label><input id="pw" type="password" autocomplete="current-password">
 ${full?"":`<label>Ім’я (для реєстрації)</label><input id="nm"><label>Хто ти?</label><select id="ro">${noA?'<option value="admin">💋 Вона (адмін-панель)</option>':""}<option value="user">😈 Він</option></select>`}
 <div class="row"><button class="btn" id="li">Увійти</button>${full?"":'<button class="btn g" id="rg">Зареєструватись</button>'}</div><p class="mu" id="er">${esc(m)}</p></div>
 <p class="mu" style="text-align:center"><a href="#" id="rc" style="color:var(--mu)">Змінити підключення до GitHub</a></p></div>`;
 $("#rc").onclick=e=>{e.preventDefault();connectView()};
 $("#li").onclick=async()=>{try{await load();const u=D.users.find(x=>x.email===$("#em").value.trim().toLowerCase());if(!u||u.hash!==await hash($("#pw").value,u.salt))return $("#er").textContent="Невірна пошта чи пароль";localStorage.setItem("me",ME=u.id);enter()}catch(e){$("#er").textContent=e.message}};
 $("#rg")&&($("#rg").onclick=async()=>{const email=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;if(!email||pw.length<6)return $("#er").textContent="Пошта й пароль від 6 символів";$("#er").textContent="…";
  try{const id=uid(),salt=uid()+uid(),h=await hash(pw,salt),role=$("#ro").value,name=$("#nm").value.trim();
   const prev=ME;ME=id;try{await mutate(d=>{if(d.users.length>=2)throw Error("Вже є двоє користувачів");if(d.users.some(u=>u.email===email))throw Error("Пошта вже зареєстрована");if(role==="admin"&&d.users.some(u=>u.role==="admin"))throw Error("Адмін вже є");
    d.users.push({id,email,salt,hash:h,role,name,bio:"",title:"",avatar:"",coins:0});ev(d,"join",`приєдна${role==="admin"?"лась":"вся"} 💞`)})}catch(e){ME=prev;throw e}
   localStorage.setItem("me",id);enter()}catch(e){$("#er").textContent=e.message}});
}
async function start(){try{await load()}catch(e){return connectView(e.message)}ME&&meU()?enter():authView()}
async function enter(){
 document.addEventListener("visibilitychange",()=>{document.body.classList.toggle("blur",document.hidden);if(document.hidden)lock();else poll()});
 $("#pin").oninput=e=>{if(e.target.value===localStorage.getItem("pin"))$("#lock").classList.remove("on");else if(e.target.value.length>=6){$("#lt").textContent="Невірно";e.target.value=""}};
 $("#ov").onclick=()=>$("#ov").classList.remove("on");$("#md").onclick=e=>{if(e.target.id==="md")$("#md").classList.remove("on")};
 lock();render();entrance();lastEv=Math.max(0,...D.events.map(e=>e.ts));setInterval(poll,20000);
}
function lock(){if(localStorage.getItem("pin")&&ME){$("#lock").classList.add("on");$("#pin").value=""}}
async function poll(){if(!ME||document.hidden)return;const old=SHA;try{await load()}catch{return}if(SHA===old)return;
 const nw=D.events.filter(e=>e.actor!==ME&&e.ts>lastEv);lastEv=Math.max(lastEv,...D.events.map(e=>e.ts));
 if(nw.length)toast("🔔 "+(isA()?"Він ":"Вона ")+nw[nw.length-1].text);if(tab!=="admin"&&!$("#md").classList.contains("on"))render()}
function entrance(){
 const k="seen_"+ME,since=+localStorage.getItem(k)||Date.now()-3*864e5,data=D.events.filter(e=>e.actor!==ME&&e.ts>since).reverse();
 localStorage.setItem(k,Date.now());if(!data.length)return;
 const a=isA(),buys=data.filter(e=>e.kind==="buy").length;
 $("#ob").textContent=a?"🛍":"🔥";
 $("#ot").textContent=a?(buys?`Він купив у тебе ${buys} ${buys>1?"речі":"річ"} 😍`:"Є новини від нього 💌"):"Вона виклала для тебе щось нове 😈";
 $("#ol").innerHTML=data.slice(0,5).map(e=>"• "+esc(e.text)).join("<br>")+(data.length>5?`<br>…і ще ${data.length-5}`:"");
 $("#ov").querySelectorAll(".fl").forEach(x=>x.remove());
 for(let n=0;n<14;n++){const f=document.createElement("div");f.className="fl";f.textContent=["🔥","💋","❤️","✨","🌹"][n%5];f.style.left=Math.random()*95+"%";f.style.animationDelay=Math.random()*4+"s";$("#ov").appendChild(f)}
 $("#ov").classList.add("on");
}

/* ===== Відображення ===== */
const avatar=p=>`<div class="av" ${p?.avatar?`data-bg="${esc(p.avatar)}"`:""}>${p?.avatar?"":"👤"}</div>`;
function mediaTag(p,t,bl){return p?(t==="video"?`<video data-m="${esc(p)}" controls playsinline class="${bl?"bl":""}"></video>`:`<img data-m="${esc(p)}" class="${bl?"bl":""}" alt="">`):""}
function btns(i,adm){
 const a=isA();let b="";
 if(!a&&!adm){
  if(i.kind==="shop"&&i.status==="open")b=`<button class="btn" data-a="buy" data-i="${i.id}">Купити за ${i.price} 🔥</button>`;
  if(i.kind==="wish"&&i.status!=="done")b=`<button class="btn" data-a="fund" data-i="${i.id}">Внести ₴ на мрію</button>`;
  if(i.kind==="quest"&&i.status==="open")b=`<button class="btn" data-a="sub" data-i="${i.id}">Я виконав ✅</button>`;
  if(i.kind==="drop"&&!i.opened)b=`<button class="btn" data-a="open" data-i="${i.id}">Відкрити 🔓</button>`;
 }
 if(adm){if(i.status==="bought")b+=`<button class="btn" data-a="done" data-i="${i.id}">Виконано ✅</button>`;if(i.status==="submitted")b+=`<button class="btn" data-a="ok" data-i="${i.id}">Підтвердити (+${i.price} 🔥)</button>`;
  b+=`<button class="btn g" data-a="edit" data-i="${i.id}">✏️</button><button class="btn g" data-a="del" data-i="${i.id}">🗑</button>`}
 return b?`<div class="row">${b}</div>`:"";
}
function fields(i){
 const pct=Math.min(100,i.price?i.funded/i.price*100:0);
 return `<div class="f"><b>${i.kind==="quest"?"Нагорода":"Ціна"}</b><span class="price">${i.price} ${cur(i.kind)}</span></div>
 ${i.kind==="wish"?`<div class="f"><b>Зібрано</b><span>${i.funded} з ${i.price} ₴<div class="bar"><i style="width:${pct}%"></i></div></span></div>`:""}
 ${i.descr?`<div class="f"><b>${i.kind==="wish"?"Що я зроблю":"Опис"}</b><span>${esc(i.descr)}</span></div>`:""}
 ${i.nuances?`<div class="f"><b>Нюанси</b><span class="nu">${esc(i.nuances)}</span></div>`:""}
 ${/^https?:\/\//.test(i.link||"")?`<div class="f"><b>Посилання</b><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--a2)">Відкрити ↗</a></div>`:""}`;
}
const ST={open:"Відкрито",bought:"Куплено — чекає виконання",submitted:"Чекає підтвердження",done:"Виконано ✅"};
function card(i,adm){
 const bl=i.kind==="drop"&&!i.opened&&!isA();
 return `<div class="card ${i.adult?"a18":""}">${i.adult?'<span class="t18">18+</span>':""}<span class="tag">${KIND[i.kind]}</span><span class="tag">${ST[i.status]||""}</span><h3>${esc(i.title)}</h3>${mediaTag(i.media,i.mtype,bl)}${fields(i)}${btns(i,adm)}</div>`;
}
function gallery(){
 const w=D.items.filter(i=>i.kind==="wish");
 return `<h2>💭 Галерея мрій</h2><p class="mu">Торкнись фото, щоб побачити все про мрію</p><div class="gal">${w.map(i=>`<div class="tile ${i.adult?"a18":""}" data-w="${i.id}">${i.adult?'<span class="t18">18+</span>':""}${i.media&&i.mtype!=="video"?`<img data-m="${esc(i.media)}" alt="">`:`<div class="ph">${i.media?"🎞️":"💭"}</div>`}<div class="cap"><b>${esc(i.title)}</b><div class="price">${i.price} ₴</div><div class="bar"><i style="width:${Math.min(100,i.price?i.funded/i.price*100:0)}%"></i></div></div></div>`).join("")}</div>${w.length?"":'<p class="mu">Вона ще не додала мрій 😏</p>'}`;
}
function detail(id){
 const i=D.items.find(x=>x.id===id);if(!i)return;const bl=!i.opened2&&!isA()&&i.media2;
 $("#mdb").innerHTML=`<div class="row" style="margin:0 0 6px;justify-content:space-between"><span>${i.adult?'<span class="t18">18+</span>':""}<span class="tag">${ST[i.status]||""}</span></span><button class="ib" id="mx">✕</button></div><h3 style="margin:4px 0">${esc(i.title)}</h3>${mediaTag(i.media,i.mtype)}${fields(i)}
 ${i.media2||i.evening?`<h2>🌙 Мій вечір для тебе</h2>${mediaTag(i.media2,i.mtype2,bl)}${bl?`<div class="row"><button class="btn" data-a="open2" data-i="${i.id}">Відкрити 🔓</button></div>`:""}${i.evening&&!bl?`<div class="f" style="grid-template-columns:1fr"><span>${esc(i.evening)}</span></div>`:""}`:""}${btns(i)}`;
 $("#md").classList.add("on");$("#mx").onclick=()=>$("#md").classList.remove("on");bind();media();
}
function render(){
 const me=meU();if(!me)return authView();
 const tabs=[["home","🏠","Головна"],["shop","🛍","Магазин"],["wish","💭","Мрії"],["quest","⚡","Квести"],["drop","🔒","Дроп"],["me","👤","Профіль"]];
 let body="";
 if(tab==="admin"&&isA())body=adminView();else if(tab==="me")body=meView();
 else if(tab==="home")body=`<div class="pair">${[her(),him()].map(p=>`<div class="pc">${avatar(p)}<b>${esc(p?.name||"—")}</b><div class="ttl">${esc(p?.title||"")}</div><div class="mu">${esc(p?.bio||"")}</div></div>`).join("")}</div>
  <h2>Що нового</h2>${D.events.slice(-6).reverse().map(e=>`<div class="fi">${e.actor===ME?"Ти":(isA()?"Він":"Вона")} ${esc(e.text)} <span class="mu">· ${new Date(e.ts).toLocaleString("uk",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>`).join("")||'<p class="mu">Поки тихо.</p>'}
  <h2>Свіже</h2>${D.items.slice(-3).reverse().map(i=>card(i)).join("")}`;
 else if(tab==="wish")body=gallery();
 else body=`<h2>${KIND[tab]}</h2><p class="mu">${HINT[tab]}</p>`+(D.items.filter(i=>i.kind===tab).reverse().map(i=>card(i)).join("")||'<p class="mu">Тут поки порожньо.</p>');
 $("#app").innerHTML=`<header><h1>🔥 Червона Кімната</h1><div class="row" style="margin:0"><div class="coin">🔥 ${him()?.coins??0}</div>${isA()?'<button class="ib" id="adm">⚙️</button>':""}</div></header>${body}
 <nav>${tabs.map(([k,i,n])=>`<button class="${k===tab?"on":""}" data-t="${k}"><span>${i}</span>${n}</button>`).join("")}</nav>`;
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
 $("#adm")&&($("#adm").onclick=()=>{tab="admin";render()});
 document.querySelectorAll("[data-w]").forEach(t=>t.onclick=()=>detail(t.dataset.w));
 bind();media();
}
function meView(){
 const p=meU();
 return `<h2>Мій профіль</h2><div class="card" style="text-align:center">${avatar(p)}<div class="ttl">${esc(p.title||"Назву тобі поставить партнерка")}</div><div class="mu">${esc(p.email)}</div></div>
 <div class="card"><label>Моє ім’я</label><input id="pn" value="${esc(p.name)}"><label>Про мене</label><textarea id="pb" rows="3">${esc(p.bio)}</textarea>
 <div class="row"><button class="btn" id="ps">💾 Зберегти</button><button class="btn g" id="ph">📷 Змінити фото</button></div><input id="pf" type="file" accept="image/*" hidden></div>
 <div class="card"><div class="row" style="margin-top:0"><button class="btn g" id="pc">🔒 PIN на телефон</button><button class="btn g" id="st">📊 Статистика</button><button class="btn g" id="lo">🚪 Вийти</button></div><p class="mu" id="sx"></p></div>`;
}
function adminView(){
 const e=edit||{kind:"shop",title:"",price:"",descr:"",nuances:"",link:"",adult:false,evening:""},q=D.items.filter(i=>["bought","submitted"].includes(i.status));
 return `<h2>⚙️ Адмін-панель</h2><div class="card"><h3>${edit?"Редагувати":"Додати нове"}</h3>
 <label>Тип</label><select id="k">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${k===e.kind?"selected":""}>${v}</option>`).join("")}</select><p class="mu" id="kh"></p>
 <label>Назва</label><input id="t" value="${esc(e.title)}">
 <label>Ціна (🔥 монети; для мрії — ₴ гривні)</label><input id="p" type="number" min="0" value="${esc(e.price)}">
 <label>Опис (що зроблю / про що мрію)</label><textarea id="d" rows="3">${esc(e.descr)}</textarea>
 <label>Нюанси (що для мене важливо)</label><textarea id="n" rows="2">${esc(e.nuances)}</textarea>
 <label>Посилання на товар</label><input id="l" value="${esc(e.link)}" placeholder="https://…">
 <label>Фото або відео ${edit?"(порожньо — не міняти)":""}</label><input id="f" type="file" accept="image/*,video/*">
 <div id="wx"><label>Моє вечірнє фото/відео до цієї мрії (18+)</label><input id="f2" type="file" accept="image/*,video/*"><label>Що я хочу зробити ввечері</label><textarea id="ev" rows="2">${esc(e.evening)}</textarea></div>
 <label><input type="checkbox" id="ad" ${e.adult?"checked":""}> Позначити як 18+ (рожеве сяйво)</label>
 <div class="row"><button class="btn" id="sv">${edit?"Зберегти":"Додати"}</button>${edit?'<button class="btn g" id="ce">Скасувати</button>':""}<span class="mu" id="sm"></span></div></div>
 <h2>Очікує на тебе (${q.length})</h2>${q.map(i=>card(i,1)).join("")||'<p class="mu">Нічого не чекає.</p>'}
 <h2>Профілі та монети</h2>${D.users.map(p=>`<div class="card"><b>${esc(p.name||p.email)}</b> <span class="mu">${p.role==="admin"?"(ти)":""}</span><label>Назва в профілі (ставиш тільки ти)</label><input data-ti="${p.id}" value="${esc(p.title)}" placeholder="напр. «Моя королева»">
 ${p.role!=="admin"?`<label>Монети 🔥</label><input data-co="${p.id}" type="number" value="${p.coins}">`:""}<div class="row"><button class="btn g" data-sp="${p.id}">Зберегти</button></div></div>`).join("")}
 <h2>Усі картки</h2>${D.items.slice().reverse().map(i=>card(i,1)).join("")}`;
}
function bind(){
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
 if($("#k")){const h=()=>{$("#kh").textContent=HINT[$("#k").value];$("#wx").style.display=$("#k").value==="wish"?"block":"none"};h();$("#k").onchange=h;$("#sv").onclick=save;$("#ce")&&($("#ce").onclick=()=>{edit=null;render()});
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=async()=>{const id=b.dataset.sp,t=document.querySelector(`[data-ti="${id}"]`).value.trim(),c=document.querySelector(`[data-co="${id}"]`);try{await mutate(d=>{const u=d.users.find(x=>x.id===id);u.title=t;if(c)u.coins=+c.value||0});toast("Збережено ✅")}catch(e){toast(e.message)}})}
 if($("#lo")){$("#lo").onclick=()=>{localStorage.removeItem("me");location.reload()};$("#ph").onclick=()=>$("#pf").click();
  $("#pf").onchange=async e=>{try{toast("Завантажую фото…");const p=await up(e.target.files[0]);await mutate(d=>{d.users.find(u=>u.id===ME).avatar=p});toast("Фото оновлено ✅");render()}catch(x){toast(x.message)}};
  $("#ps").onclick=async()=>{try{await mutate(d=>{const u=d.users.find(x=>x.id===ME);u.name=$("#pn").value.trim();u.bio=$("#pb").value.trim()});toast("Профіль збережено ✅");render()}catch(x){toast(x.message)}};
  $("#pc").onclick=()=>{const p=prompt("PIN 4–6 цифр для цього телефона. Порожньо — вимкнути.");if(p!==null){p?localStorage.setItem("pin",p):localStorage.removeItem("pin")}};
  $("#st").onclick=()=>{const m=D.events.filter(e=>e.actor===ME);$("#sx").textContent=`Твоїх дій: ${m.length} · покупок: ${m.filter(e=>e.kind==="buy").length} · усього подій у вас: ${D.events.length}`}}
}
async function save(){
 const t=$("#t").value.trim();if(!t){$("#sm").textContent="Додай назву";return}$("#sv").disabled=true;$("#sm").textContent="Завантаження…";
 try{const r={kind:$("#k").value,title:t,price:+$("#p").value||0,descr:$("#d").value.trim(),nuances:$("#n").value.trim(),link:$("#l").value.trim(),adult:$("#ad").checked,evening:$("#ev").value.trim()};
  const f=$("#f").files[0],f2=$("#f2").files[0];
  if(f){r.media=await up(f);r.mtype=f.type.startsWith("video")?"video":"image"}
  if(f2&&r.kind==="wish"){r.media2=await up(f2);r.mtype2=f2.type.startsWith("video")?"video":"image"}
  await mutate(d=>{if(edit){Object.assign(d.items.find(x=>x.id===edit.id),r)}else{d.items.push({id:uid(),status:"open",funded:0,opened:false,opened2:false,ts:Date.now(),...r});ev(d,"post",`додала ${KIND[r.kind]}: ${t}${r.adult?" · 18+":""}`)}});
  edit=null;toast("Збережено ✅");render()}catch(e){$("#sm").textContent="Помилка: "+e.message;$("#sv").disabled=false}
}
async function act(a,id){
 const i0=D.items.find(x=>x.id===id);let v=0;
 if(a==="edit"){edit=i0;$("#md").classList.remove("on");render();scrollTo(0,0);return}
 if(a==="del"&&!confirm("Видалити назавжди?"))return;
 if(a==="fund"){v=+prompt("Скільки гривень внести на цю мрію?");if(!(v>0))return}
 try{await mutate(d=>{const i=d.items.find(x=>x.id===id),me=d.users.find(u=>u.id===ME);if(!i)throw Error("Картку видалено");
  if(a==="buy"){if(i.status!=="open")throw Error("Вже куплено");if(me.coins<i.price)throw Error("Не вистачає монет 🔥 Заробляй квестами!");me.coins-=i.price;i.status="bought";i.by_user=ME;ev(d,"buy",`купив: ${i.title} за ${i.price} 🔥`)}
  if(a==="fund"){i.funded+=v;if(i.funded>=i.price)i.status="done";ev(d,"fund",`вніс ${v} ₴ на мрію «${i.title}» (${Math.min(i.funded,i.price)}/${i.price})`)}
  if(a==="sub"){i.status="submitted";i.by_user=ME;ev(d,"sub",`виконав квест «${i.title}»`)}
  if(a==="open"){i.opened=true;ev(d,"open",`відкрив матеріал «${i.title}»`)}
  if(a==="open2"){i.opened2=true;ev(d,"open",`відкрив твоє вечірнє фото до «${i.title}» 🌙`)}
  if(a==="done"){i.status="done";ev(d,"done",`виконала «${i.title}» ✅`)}
  if(a==="ok"){if(me.role!=="admin")throw Error("Лише адмін");d.users.find(u=>u.id===i.by_user).coins+=i.price;i.status="done";ev(d,"ok",`підтвердила «${i.title}», нараховано ${i.price} 🔥`)}
  if(a==="del")d.items.splice(d.items.indexOf(i),1)})}catch(e){toast(e.message)}
 $("#md").classList.remove("on");render();
}
CFG?start():connectView();
</script></body></html>
